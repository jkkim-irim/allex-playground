<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ALLEX Playground</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #14171c; color: #e6e8eb; overflow: hidden;
      font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    /* <canvas> is a replaced element: `inset: 0` alone will NOT stretch it, so
       width:auto resolves to the intrinsic 300x150 and the render collapses into
       a corner. The explicit 100% is required. */
    #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

    /* ===== always-on key guide, top left ===== */
    #keyguide {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(12, 14, 18, .62); border: 1px solid #262c34;
      border-radius: 8px; padding: 9px 11px;
      backdrop-filter: blur(5px); pointer-events: none;
    }
    #keyguide td { padding: 1px 0; color: #8b95a3; font-size: 12px; }
    #keyguide td:first-child { white-space: nowrap; padding-right: 9px; }

    /* ===== Esc menu ===== */
    #menu {
      position: fixed; inset: 0; z-index: 30; display: flex;
      align-items: flex-start; justify-content: center;
      background: rgba(8, 10, 13, .72); backdrop-filter: blur(3px);
      padding: 6vh 16px 16px;
    }
    #menu[hidden] { display: none; }
    #card {
      background: rgba(14, 17, 22, .96); border: 1px solid #2b313a;
      border-radius: 10px; padding: 16px 18px;
      width: min(560px, 100%); max-height: 88vh; overflow: auto;
    }
    #card h1 {
      margin: 0 0 12px; font-size: 13px; letter-spacing: .04em; color: #9fb4d0;
    }
    #tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    #tabs button {
      flex: 1; padding: 8px 10px; cursor: pointer;
      background: #1b2027; color: #c3ccd8;
      border: 1px solid #333c48; border-radius: 6px;
      font: inherit; font-size: 12px;
    }
    #tabs button:hover { background: #222933; }
    #tabs button[aria-selected="true"] {
      background: #2a3644; color: #eaf0f7; border-color: #46566a;
    }
    .pane[hidden] { display: none; }
    #hint { margin-top: 14px; color: #6f7b89; font-size: 11px; }

    table { border-collapse: collapse; width: 100%; }
    td { padding: 2px 0; vertical-align: top; }
    td.k { color: #8b95a3; padding-right: 12px; white-space: nowrap; }
    td.v { text-align: right; font-variant-numeric: tabular-nums; }
    .good { color: #6ddf8f; } .warn { color: #f0c268; } .bad { color: #ff7a6b; }
    hr { border: 0; border-top: 1px solid #2b313a; margin: 12px 0; }
    #log { margin-top: 10px; color: #7f8b99; white-space: pre-wrap; font-size: 12px; }

    #settings { margin-bottom: 12px; }
    .griprow { display: flex; align-items: center; gap: 8px; }
    .griprow > span:first-child { color: #8b95a3; min-width: 2.6em; }
    .meter { flex: 1; height: 7px; background: #232932; border-radius: 4px; overflow: hidden; }
    #gripfill { height: 100%; width: 0%; background: #6ddf8f; transition: width .05s linear; }
    .griprow input[type=range] {
      flex: 1; height: 7px; -webkit-appearance: none; appearance: none;
      background: #232932; border-radius: 4px; outline: none;
    }
    .griprow input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #9fb4d0; cursor: pointer;
    }
    .griprow input[type=range]::-moz-range-thumb {
      width: 12px; height: 12px; border: 0; border-radius: 50%;
      background: #9fb4d0; cursor: pointer;
    }
    .griprow .v { min-width: 3.4em; text-align: right; }

    /* key guide pane: key chip + one-line explanation */
    #keydetail tr + tr td { padding-top: 7px; }
    #keydetail td:first-child { white-space: nowrap; padding-right: 12px; width: 1%; }
    #keydetail .why { color: #8b95a3; font-size: 12px; }
    .key {
      display: inline-block; background: #232932; border: 1px solid #333c48;
      border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
      color: #c3ccd8; font-size: 11px;
    }

    /* loading line, centre screen until the scene is up */
    #boot {
      position: fixed; inset: 0; z-index: 20; display: flex;
      align-items: center; justify-content: center;
      color: #8b95a3; font-size: 13px; pointer-events: none;
    }
    #boot[hidden] { display: none; }
  </style>
  <script type="module" crossorigin src="./assets/index-BB1ne12V.js"></script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="boot">loading…</div>

  <div id="keyguide"><table id="keys"></table></div>

  <div id="menu" hidden>
    <div id="card">
      <h1>ALLEX Playground</h1>
      <div id="tabs">
        <button id="tab-status" aria-selected="true">상태 확인</button>
        <button id="tab-keys" aria-selected="false">키 가이드</button>
      </div>

      <div id="pane-status" class="pane">
        <div id="settings">
          <div class="griprow">
            <span>grip</span>
            <div class="meter"><div id="gripfill"></div></div>
            <span id="gripval" class="v">0.00</span>
          </div>
          <div class="griprow" style="margin-top:7px">
            <span>fov</span>
            <input id="fov" type="range" min="20" max="120" step="1" value="51" />
            <span id="fovval" class="v">51°</span>
          </div>
          <!-- 30 deg is the requested camera tilt. On its own that frames floor:
               from an eye at 0.95 m the ray only reaches bench height at
               x ~ 1.5 m, past a bench spanning x 0.28-0.76. The robot's neck is
               pitched 30 deg to make up the difference; this slider is here for
               anyone who wants a different framing. -->
          <div class="griprow" style="margin-top:5px">
            <span>tilt</span>
            <input id="pitch" type="range" min="0" max="85" step="1" value="30" />
            <span id="pitchval" class="v">30°</span>
          </div>
        </div>
        <hr />
        <table id="stats"></table>
        <div id="log">booting…</div>
      </div>

      <div id="pane-keys" class="pane" hidden>
        <table id="keydetail"></table>
      </div>

      <div id="hint">Esc 를 다시 누르면 장면으로 돌아갑니다.</div>
    </div>
  </div>

</body>
</html>
