<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Without this a phone lays the page out at 980 CSS px and scales the result
       down. Measured at a 375 px viewport with no viewport meta: the document
       reported clientWidth 980 and scrolled horizontally, so the canvas was
       letterboxed and every control ended up smaller than a fingertip.
       viewport-fit=cover is what lets the env(safe-area-inset-*) rules below
       actually apply on notched devices. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14171c" />
  <meta name="description"
        content="Drive a real bimanual robot's MJCF model in the browser." />
  <title>ALLEX Playground</title>

  <!-- Installable as a PWA. The service worker already caches everything, so this
       only adds the identity an install needs: name, icon, colours, display mode. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <!-- iOS does not read the manifest for home-screen installs; it reads these. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ALLEX" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: #14171c; color: #e6e8eb; overflow: hidden;
      font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      /* Stop the pull-to-refresh / rubber-band gesture from fighting a drag that
         was meant for the camera. */
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
    /* <canvas> is a replaced element: `inset: 0` alone will NOT stretch it, so
       width:auto resolves to the intrinsic 300x150 and the render collapses into
       a corner. The explicit 100% is required. */
    /* touch-action: none so the canvas owns its gestures. Without it a drag scrolls
       the page instead of orbiting, and a double-tap zooms the whole UI. */
    #view {
      position: fixed; inset: 0; display: block; width: 100%; height: 100%;
      touch-action: none;
    }

    /* ===== always-on key guide, top left ===== */
    #keyguide {
      position: fixed; z-index: 10;
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      background: rgba(12, 14, 18, .62); border: 1px solid #262c34;
      border-radius: 8px; padding: 9px 11px;
      backdrop-filter: blur(5px); pointer-events: none;
    }
    #keyguide td { padding: 1px 0; color: #8b95a3; font-size: 12px; }
    #keyguide td:first-child { white-space: nowrap; padding-right: 9px; }

    /* ===== Esc menu ===== */
    #menu {
      position: fixed; inset: 0; z-index: 30; display: flex;
      align-items: flex-start; justify-content: center;
      background: rgba(8, 10, 13, .72); backdrop-filter: blur(3px);
      padding: 6vh 16px 16px;
    }
    #menu[hidden] { display: none; }
    #card {
      background: rgba(14, 17, 22, .96); border: 1px solid #2b313a;
      border-radius: 10px; padding: 16px 18px;
      width: min(560px, 100%); max-height: 88vh; overflow: auto;
    }
    #cardhead {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    #card h1 {
      margin: 0; flex: 1; font-size: 13px; letter-spacing: .04em; color: #9fb4d0;
    }
    #close {
      flex: none; width: 34px; height: 34px; cursor: pointer;
      background: #1b2027; color: #c3ccd8;
      border: 1px solid #333c48; border-radius: 6px;
      font: inherit; font-size: 13px; line-height: 1;
    }
    #close:hover { background: #222933; }
    @media (pointer: coarse) { #close { width: 44px; height: 44px; font-size: 15px; } }

    /* Install button. Chrome/Android fires beforeinstallprompt and this is the only
       way to trigger the install from inside the page; it stays hidden when the
       event never arrives (already installed, or a browser without support). */
    #installrow { margin-bottom: 12px; }
    #install {
      width: 100%; padding: 10px; cursor: pointer;
      background: #24405e; color: #dce8f5;
      border: 1px solid #3a5f86; border-radius: 6px; font: inherit; font-size: 12px;
    }
    #install:hover { background: #2a4b6d; }
    #install:disabled { opacity: .55; cursor: default; }
    @media (pointer: coarse) { #install { min-height: 46px; font-size: 13px; } }
    #tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    #tabs button {
      flex: 1; padding: 8px 10px; cursor: pointer;
      background: #1b2027; color: #c3ccd8;
      border: 1px solid #333c48; border-radius: 6px;
      font: inherit; font-size: 12px;
    }
    #tabs button:hover { background: #222933; }
    #tabs button[aria-selected="true"] {
      background: #2a3644; color: #eaf0f7; border-color: #46566a;
    }
    .pane[hidden] { display: none; }
    #hint { margin-top: 14px; color: #6f7b89; font-size: 11px; }

    table { border-collapse: collapse; width: 100%; }
    td { padding: 2px 0; vertical-align: top; }
    td.k { color: #8b95a3; padding-right: 12px; white-space: nowrap; }
    td.v { text-align: right; font-variant-numeric: tabular-nums; }
    .good { color: #6ddf8f; } .warn { color: #f0c268; } .bad { color: #ff7a6b; }
    hr { border: 0; border-top: 1px solid #2b313a; margin: 12px 0; }
    #log { margin-top: 10px; color: #7f8b99; white-space: pre-wrap; font-size: 12px; }

    #settings { margin-bottom: 12px; }
    .griprow { display: flex; align-items: center; gap: 8px; }
    .griprow > span:first-child { color: #8b95a3; min-width: 2.6em; }
    .meter { flex: 1; height: 7px; background: #232932; border-radius: 4px; overflow: hidden; }
    #gripfill { height: 100%; width: 0%; background: #6ddf8f; transition: width .05s linear; }
    .griprow input[type=range] {
      flex: 1; height: 7px; -webkit-appearance: none; appearance: none;
      background: #232932; border-radius: 4px; outline: none;
    }
    .griprow input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #9fb4d0; cursor: pointer;
    }
    .griprow input[type=range]::-moz-range-thumb {
      width: 12px; height: 12px; border: 0; border-radius: 50%;
      background: #9fb4d0; cursor: pointer;
    }
    .griprow .v { min-width: 3.4em; text-align: right; }

    /* key guide pane: key chip + one-line explanation */
    #keydetail tr + tr td { padding-top: 7px; }
    #keydetail td:first-child { white-space: nowrap; padding-right: 12px; width: 1%; }
    #keydetail .why { color: #8b95a3; font-size: 12px; }
    .key {
      display: inline-block; background: #232932; border: 1px solid #333c48;
      border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
      color: #c3ccd8; font-size: 11px;
    }

    /* ===== on-screen control pad, bottom right ===== */
    #pad {
      position: fixed; z-index: 12;
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      /* The pad itself must not eat drags meant for the canvas; only its buttons do. */
      pointer-events: none;
    }
    .padgrp {
      display: flex; align-items: center; gap: 5px;
      pointer-events: none;
    }
    .padlbl {
      flex: 1; text-align: right; padding-right: 3px;
      color: #8b95a3; font-size: 11px;
    }
    .padbtn {
      pointer-events: auto;
      width: 40px; height: 36px; flex: none; cursor: pointer;
      background: rgba(27, 32, 39, .82); color: #c3ccd8;
      border: 1px solid #333c48; border-radius: 7px;
      font: inherit; font-size: 14px; line-height: 1;
      backdrop-filter: blur(5px);
      /* A held button must not also select text or fire the OS long-press menu. */
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .padbtn:hover { background: rgba(34, 41, 51, .9); }
    /* .on rather than :active, because a pointer captured by the button still counts
       as held after the finger slides off it. */
    .padbtn.on { background: #2a4b6d; border-color: #46566a; color: #eaf0f7; }
    #gripbtn { width: auto; min-width: 91px; height: 42px; font-size: 12px; letter-spacing: .06em; }
    /* Third person is look-only. The axis buttons go dim and stop accepting taps; the
       tap row (view / home / reset) stays live, since 시점 is how you get back. */
    #pad.inert .padbtn[data-hold] {
      opacity: .35; pointer-events: none;
    }
    #pad.inert .padlbl { opacity: .35; }
    .padtaps { gap: 5px; }
    .padtaps .padbtn { width: 47px; font-size: 11px; }
    @media (pointer: coarse) {
      .padbtn { width: 52px; height: 46px; font-size: 16px; }
      #gripbtn { min-width: 115px; height: 54px; }
      .padtaps .padbtn { width: 60px; font-size: 12px; }
      .padlbl { font-size: 12px; }
    }

    /* ===== small screens and touch devices ===== */
    /* Narrow viewport: the menu card was a fixed 560 px and the key guide a fixed
       211 x 327, which on a 375 px phone is most of the screen. */
    @media (max-width: 720px) {
      #menu { padding: 3vh 8px 8px; }
      #card { padding: 14px; max-height: 94vh; }
      #keyguide { padding: 7px 9px; max-height: 40vh; overflow: auto; }
      #keyguide td { font-size: 11px; }
      #keyguide td:first-child { padding-right: 7px; }
    }
    /* Coarse pointer: fingers need targets around 44 px, and the default 12 px
       slider thumbs are unusable. */
    @media (pointer: coarse) {
      #tabs button { min-height: 44px; }
      .griprow input[type=range] { height: 24px; }
      .griprow input[type=range]::-webkit-slider-thumb { width: 24px; height: 24px; }
      .griprow input[type=range]::-moz-range-thumb { width: 24px; height: 24px; }
    }

    /* A touch-primary device has no keyboard, which makes the always-on key list
       noise AND makes the Esc menu unreachable -- there is no Esc to press. Swap the
       list for a button that opens the same menu, and say plainly that touch control
       of the robot is not built yet, so a phone visitor is not left wondering why
       the robot ignores them. Camera orbit does work: OrbitControls handles touch. */
    #menubtn {
      display: none;
      position: fixed; z-index: 15;
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      width: 46px; height: 46px; align-items: center; justify-content: center;
      background: rgba(12, 14, 18, .72); border: 1px solid #262c34;
      border-radius: 10px; color: #c3ccd8; font: inherit; font-size: 19px;
      backdrop-filter: blur(5px); cursor: pointer;
    }
    @media (hover: none) and (pointer: coarse) {
      #keyguide { display: none; }
      #menubtn { display: flex; }
    }

    /* ===== scoreboard, top centre, both platforms ===== */
    #scoreboard {
      position: fixed; z-index: 14; left: 50%; transform: translateX(-50%);
      top: calc(12px + env(safe-area-inset-top));
      display: flex; align-items: center; gap: 12px;
      background: rgba(12, 14, 18, .72); border: 1px solid #262c34;
      border-radius: 8px; padding: 7px 13px;
      backdrop-filter: blur(5px); pointer-events: none;
      font-size: 12.5px; white-space: nowrap;
    }
    #scoreboard .win { color: #6ddf8f; }
    #scoreboard .lose { color: #ff7a6b; }
    #scoreboard .live { color: #9fb4d0; font-variant-numeric: tabular-nums; }
    #scoreboard .sep { color: #3a424e; }
    @media (max-width: 480px) {
      #scoreboard { font-size: 11px; gap: 8px; padding: 6px 10px; }
    }

    /* Outcome banner, under the scoreboard, only between attempts. */
    #banner {
      position: fixed; z-index: 14; left: 50%; transform: translateX(-50%);
      top: calc(56px + env(safe-area-inset-top));
      padding: 9px 16px; border-radius: 8px; font-size: 14px; letter-spacing: .02em;
      backdrop-filter: blur(5px); pointer-events: none; display: none;
    }
    #banner.win {
      display: block; color: #d6ffe4; background: rgba(31, 92, 55, .88);
      border: 1px solid #4fd873;
    }
    #banner.lose {
      display: block; color: #ffdcd7; background: rgba(104, 40, 34, .88);
      border: 1px solid #e0483c;
    }

    /* ===== leaderboard pane ===== */
    #lbtable { width: 100%; font-size: 12px; }
    #lbtable th {
      text-align: left; color: #8b95a3; font-weight: normal;
      border-bottom: 1px solid #2b313a; padding: 0 6px 5px 0;
    }
    #lbtable td { padding: 3px 6px 3px 0; font-variant-numeric: tabular-nums; }
    #lbtable td.num { text-align: right; }
    #lbnote { margin-top: 12px; color: #f0c268; font-size: 11.5px; line-height: 1.6; }
    #boardlevel { color: #9fb4d0; font-size: 11px; letter-spacing: .05em; margin-bottom: 8px; }
    #namerow { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    #namerow input {
      flex: 1; padding: 8px 10px; background: #1b2027; color: #e6e8eb;
      border: 1px solid #333c48; border-radius: 6px; font: inherit; font-size: 12px;
    }
    #namerow button {
      padding: 8px 12px; cursor: pointer; background: #24405e; color: #dce8f5;
      border: 1px solid #3a5f86; border-radius: 6px; font: inherit; font-size: 12px;
    }
    @media (pointer: coarse) { #namerow input, #namerow button { min-height: 44px; } }

    /* ===== live leaderboard, bottom left =====
       Bottom left is the one free corner: the key guide is top left, the scoreboard top
       centre, the pad bottom right. pointer-events: none so it never swallows a drag
       meant for the canvas -- XY is steered by dragging anywhere on the scene. */
    #lbhud {
      position: fixed; z-index: 13;
      left: calc(12px + env(safe-area-inset-left));
      bottom: calc(12px + env(safe-area-inset-bottom));
      min-width: 172px; max-width: 46vw;
      background: rgba(12, 14, 18, .62); border: 1px solid #262c34;
      border-radius: 8px; padding: 8px 10px;
      backdrop-filter: blur(5px); pointer-events: none;
    }
    #lbhud[hidden] { display: none; }
    #lbhudhead {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      color: #9fb4d0; font-size: 11px; letter-spacing: .05em; margin-bottom: 5px;
    }
    #lbhudlive { color: #6f7b89; font-size: 10px; }
    #lbhudtable { border-collapse: collapse; width: 100%; }
    #lbhudtable td { font-size: 12px; color: #c3ccd8; padding: 1px 0; line-height: 1.5; }
    #lbhudtable td.rank { color: #6f7b89; padding-right: 7px; }
    #lbhudtable td.who {
      max-width: 10.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* The device the run was played on, dimmer than the name so it reads as an
       annotation rather than part of it. */
    .plat { color: #6f7b89; font-size: .85em; margin-left: 4px; }
    #lbhudtable tr.me td .plat { color: #8b95a3; }
    #lbhudtable td.pts {
      text-align: right; padding-left: 8px; color: #9fb4d0;
      font-variant-numeric: tabular-nums;
    }
    /* Your own row, so you can find yourself without reading every name. */
    #lbhudtable tr.me td { color: #eaf0f7; }
    #lbhudtable tr.me td.pts { color: #6ddf8f; }
    #lbhudnote { color: #6f7b89; font-size: 10px; margin-top: 4px; line-height: 1.5; }
    @media (max-width: 480px) {
      #lbhud { min-width: 148px; padding: 6px 8px; }
      #lbhudtable td { font-size: 11px; }
    }

    /* ===== portrait gate =====
       z above the name gate (40): rotate first, then name. */
    #rotate {
      position: fixed; inset: 0; z-index: 50; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      background: #14171c;
    }
    #rotate[hidden] { display: none; }
    #rotbox { width: 100%; max-width: 320px; text-align: center; }
    #roticon {
      font-size: 40px; color: #9fb4d0; margin-bottom: 10px;
      animation: tip 1.8s ease-in-out infinite;
    }
    /* Hidden in landscape: there is nothing left to turn, and an animated rotate arrow
       over a screen that is already sideways reads as an instruction that was not
       followed. */
    #roticon[hidden] { display: none; }
    /* Motion is the message here -- it says "turn this" faster than the text does.
       Respect a reduced-motion preference rather than overriding it. */
    @keyframes tip { 0%, 60%, 100% { transform: rotate(0deg); }
                     30% { transform: rotate(90deg); } }
    @media (prefers-reduced-motion: reduce) { #roticon { animation: none; } }
    #rotbox h2 { margin: 0 0 8px; font-size: 17px; color: #e6e8eb; font-weight: 600; }
    #rotbox p { margin: 0 0 18px; font-size: 12.5px; color: #8b95a3; line-height: 1.7; }
    #gofull, #rotinstall, #openext {
      display: block; width: 100%; min-height: 48px; margin-bottom: 9px;
      cursor: pointer; background: #24405e; color: #dce8f5;
      border: 1px solid #3a5f86; border-radius: 8px; font: inherit; font-size: 13px;
    }
    /* When an in-app browser is the problem, leaving it is the primary action and the
       other two are consolation prizes -- so this one keeps the accent and they lose it. */
    #openext { background: #2f6b3f; border-color: #48915b; }
    #rotinstall, #openext ~ #gofull {
      background: #1b2027; color: #c3ccd8; border-color: #333c48;
    }
    #rotinstall[hidden], #openext[hidden] { display: none; }
    #openext[hidden] ~ #gofull {
      background: #24405e; color: #dce8f5; border-color: #3a5f86;
    }
    #rotnote { min-height: 15px; margin-top: 6px; color: #6f7b89; font-size: 11px; }

    /* ===== haptics toggle ===== */
    /* Hidden entirely where navigator.vibrate does not exist -- iOS, and every desktop
       browser -- rather than shown as a switch that does nothing. */
    #hapticrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    #hapticrow[hidden] { display: none; }
    #hapticrow > span { color: #8b95a3; font-size: 12px; flex: none; }
    #haptictoggle {
      flex: 1; padding: 8px 10px; cursor: pointer;
      background: #1b2027; color: #c3ccd8;
      border: 1px solid #333c48; border-radius: 6px; font: inherit; font-size: 12px;
    }
    #haptictoggle[aria-pressed="true"] {
      background: #2a3644; color: #eaf0f7; border-color: #46566a;
    }
    @media (pointer: coarse) { #haptictoggle { min-height: 44px; } }

    /* ===== level selector ===== */
    #levelrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    #levellbl { color: #8b95a3; font-size: 12px; flex: none; }
    #levelbtns { display: flex; gap: 8px; flex: 1; }
    .lvlbtn {
      flex: 1; padding: 8px 10px; cursor: pointer;
      background: #1b2027; color: #c3ccd8;
      border: 1px solid #333c48; border-radius: 6px; font: inherit; font-size: 12px;
    }
    .lvlbtn:hover { background: #222933; }
    .lvlbtn[aria-selected="true"] {
      background: #2a3644; color: #eaf0f7; border-color: #46566a;
    }
    /* Locked reads as unavailable rather than merely unselected, and says why on hover. */
    .lvlbtn[disabled] { opacity: .45; cursor: not-allowed; }
    @media (pointer: coarse) { .lvlbtn { min-height: 44px; } }

    /* ===== unlock ===== */
    #unlock {
      position: fixed; inset: 0; z-index: 46; display: flex;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(8, 10, 13, .86); backdrop-filter: blur(4px);
    }
    #unlock[hidden] { display: none; }
    #unlockbox {
      width: 100%; max-width: 340px; text-align: center;
      background: #12161b; border: 1px solid #3a5f86; border-radius: 12px;
      padding: 24px 22px;
    }
    #unlockicon { font-size: 34px; margin-bottom: 8px; }
    #unlockbox h2 { margin: 0 0 8px; font-size: 16px; color: #6ddf8f; font-weight: 600; }
    #unlockbox p { margin: 0 0 18px; font-size: 12.5px; color: #8b95a3; line-height: 1.7; }
    #unlockok {
      width: 100%; min-height: 46px; cursor: pointer;
      background: #24405e; color: #dce8f5; border: 1px solid #3a5f86;
      border-radius: 8px; font: inherit; font-size: 13px;
    }
    @media (pointer: coarse) { #unlockok { min-height: 48px; } }

    /* ===== briefing =====
       Above the name gate (40) so the two cannot overlap while one is being dismissed,
       below the start gate (50), which has to outrank everything. */
    #brief {
      position: fixed; inset: 0; z-index: 45; display: flex;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(8, 10, 13, .82); backdrop-filter: blur(4px);
    }
    #brief[hidden] { display: none; }
    #briefbox {
      width: 100%; max-width: 380px; text-align: center;
      background: #12161b; border: 1px solid #262c34; border-radius: 12px;
      padding: 24px 22px;
    }
    #brieflevel {
      color: #6f7b89; font-size: 11px; letter-spacing: .22em; margin-bottom: 12px;
    }
    #brieftitle {
      margin: 0 0 20px; font-size: 15px; line-height: 1.75; color: #e6e8eb;
      font-weight: 500;
    }
    /* Exactly the props' material rgba from game_level0_slim.xml:
       prop_blue 0.24 0.45 0.78, prop_yellow 0.88 0.72 0.20. */
    .c-blue { color: rgb(61, 115, 199); font-weight: 600; }
    .c-yellow { color: rgb(224, 184, 51); font-weight: 600; }
    .c-red { color: rgb(209, 71, 56); font-weight: 600; }
    #briefok {
      width: 100%; min-height: 46px; padding: 11px 12px; cursor: pointer;
      background: #24405e; color: #dce8f5; border: 1px solid #3a5f86;
      border-radius: 8px; font: inherit; font-size: 13px;
    }
    #briefok:hover { background: #2a4b6d; }
    @media (pointer: coarse) { #briefok { min-height: 48px; } }

    /* ===== name gate =====
       z-index above the Esc menu (30) on purpose: the name is required, so the menu
       must not be a way around it. */
    #namegate {
      position: fixed; inset: 0; z-index: 40; display: flex;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(8, 10, 13, .82); backdrop-filter: blur(4px);
    }
    #namegate[hidden] { display: none; }
    #namebox {
      width: 100%; max-width: 340px; text-align: center;
      background: #12161b; border: 1px solid #262c34; border-radius: 12px;
      padding: 22px 20px;
    }
    #namebox h2 { margin: 0 0 6px; font-size: 16px; color: #e6e8eb; font-weight: 600; }
    #namebox p { margin: 0 0 16px; font-size: 12px; color: #8b95a3; line-height: 1.6; }
    #gateName {
      width: 100%; box-sizing: border-box; text-align: center;
      padding: 11px 12px; margin-bottom: 10px;
      background: #1b2027; color: #e6e8eb; border: 1px solid #333c48;
      border-radius: 8px; font: inherit; font-size: 15px; letter-spacing: .02em;
    }
    #gateName:focus { outline: none; border-color: #3a5f86; }
    #gateStart {
      width: 100%; padding: 11px 12px; cursor: pointer;
      background: #24405e; color: #dce8f5; border: 1px solid #3a5f86;
      border-radius: 8px; font: inherit; font-size: 13px;
    }
    #gateStart:hover { background: #2a4b6d; }
    #gateErr { min-height: 16px; margin-top: 8px; color: #ff7a6b; font-size: 11.5px; }
    @media (pointer: coarse) { #gateName, #gateStart { min-height: 48px; } }

    /* loading line, centre screen until the scene is up */
    #boot {
      position: fixed; inset: 0; z-index: 20; display: flex;
      align-items: center; justify-content: center;
      color: #8b95a3; font-size: 13px; pointer-events: none;
    }
    #boot[hidden] { display: none; }
  </style>
  <script type="module" crossorigin src="./assets/index-JWH9bQ_b.js"></script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="boot">loading…</div>

  <div id="scoreboard">
    <span class="win">성공 <b id="sbWin">0</b></span>
    <span class="sep">|</span>
    <span class="lose">실패 <b id="sbLose">0</b></span>
    <span class="sep">|</span>
    <span class="live" id="sbLive">—</span>
  </div>
  <div id="banner"></div>

  <div id="keyguide"><table id="keys"></table></div>

  <!-- Live leaderboard. Kept up to date by the store's own sync, so it reflects other
       players without reloading the page. -->
  <div id="lbhud" hidden>
    <div id="lbhudhead"><span>리더보드</span><span id="lbhudlive"></span></div>
    <table id="lbhudtable"></table>
    <div id="lbhudnote"></div>
  </div>

  <!-- Portrait gate, touch devices only. Above the name gate: rotating first means the
       name dialog is not laid out in a shape the game never uses. -->
  <div id="rotate" hidden>
    <div id="rotbox">
      <div id="roticon">⟳</div>
      <h2 id="rottitle">전체화면으로 시작</h2>
      <p id="rotbody">전체화면으로 가로 고정한 뒤 시작합니다.</p>
      <button id="openext" type="button" hidden>Chrome에서 열기</button>
      <button id="gofull" type="button">전체화면으로 시작</button>
      <button id="rotinstall" type="button" hidden>앱으로 설치</button>
      <div id="rotnote"></div>
    </div>
  </div>

  <!-- The locked level opened. Its name is filled in from LEVELS so renumbering cannot
       leave a stale one hardcoded here. Sits above the briefing so the two cannot stack. -->
  <div id="unlock" hidden>
    <div id="unlockbox">
      <div id="unlockicon">🔓</div>
      <h2 id="unlocktitle">잠금 해제</h2>
      <p id="unlockbody"></p>
      <button id="unlockok" type="button">확인</button>
    </div>
  </div>

  <!-- Briefing, between the name and the first episode. The colour words are tinted with
       the props' own material rgba from the scene MJCF, so "파란색" and "노란색" cannot
       drift from what is actually on the bench. -->
  <div id="brief" hidden>
    <div id="briefbox">
      <div id="brieflevel">LEVEL 1</div>
      <h2 id="brieftitle"></h2>
      <button id="briefok" type="button">확인</button>
    </div>
  </div>

  <!-- Name gate. The episode's whole purpose is a leaderboard entry, so a run with no
       name has nowhere to go -- the game does not start until this is answered. -->
  <div id="namegate" hidden>
    <div id="namebox">
      <h2>이름을 입력하세요</h2>
      <p>리더보드에 표시할 이름입니다.<br />최대 8글자.</p>
      <input id="gateName" type="text" maxlength="8" placeholder="이름"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="go" />
      <button id="gateStart" type="button">게임 시작</button>
      <div id="gateErr"></div>
    </div>
  </div>

  <button id="menubtn" type="button" aria-label="메뉴 열기">☰</button>

  <!-- Height, orientation and grip. Shown on every device: these are the axes you
       hold and trim, and XY is pointed at instead (right-drag / one finger), so there
       is nothing here that duplicates a drag. data-hold is the action id from
       controls.js KEYS, so a button and its key drive exactly the same code. -->
  <div id="pad">
    <div class="padgrp">
      <span class="padlbl">Z</span>
      <button class="padbtn" data-hold="up" aria-label="위로">▲</button>
      <button class="padbtn" data-hold="down" aria-label="아래로">▼</button>
    </div>
    <div class="padgrp">
      <span class="padlbl">roll</span>
      <button class="padbtn" data-hold="rollNeg" aria-label="roll −">−</button>
      <button class="padbtn" data-hold="rollPos" aria-label="roll +">+</button>
    </div>
    <div class="padgrp">
      <span class="padlbl">pitch</span>
      <button class="padbtn" data-hold="pitchNeg" aria-label="pitch −">−</button>
      <button class="padbtn" data-hold="pitchPos" aria-label="pitch +">+</button>
    </div>
    <div class="padgrp">
      <span class="padlbl">yaw</span>
      <button class="padbtn" data-hold="yawNeg" aria-label="yaw −">−</button>
      <button class="padbtn" data-hold="yawPos" aria-label="yaw +">+</button>
    </div>
    <!-- data-tap, not data-hold: GRIP latches. One tap closes, the next opens. -->
    <button id="gripbtn" class="padbtn" data-tap="grip" aria-label="쥐기 토글">GRIP</button>
    <!-- data-tap, not data-hold: these fire once per press however long it is held. -->
    <div class="padgrp padtaps">
      <button class="padbtn" data-tap="view" aria-label="시점 변경">시점</button>
      <button class="padbtn" data-tap="reset" aria-label="전체 리셋">리셋</button>
    </div>
  </div>

  <div id="menu" hidden>
    <div id="card">
      <div id="cardhead">
        <h1>ALLEX Playground</h1>
        <!-- Without this the menu is a trap on touch: #menu (z 30) covers #menubtn
             (z 15), so the button that opened it is unreachable and there is no Esc
             key to fall back on. Verified with elementFromPoint -- it returned
             DIV#menu at the button's own coordinates. -->
        <button id="close" type="button" aria-label="메뉴 닫기">✕</button>
      </div>
      <div id="hapticrow" hidden>
        <span>진동</span>
        <button id="haptictoggle" type="button" aria-pressed="true">켜짐</button>
      </div>

      <div id="levelrow">
        <span id="levellbl">작업</span>
        <div id="levelbtns"></div>
      </div>

      <div id="tabs">
        <button id="tab-status" aria-selected="true">상태 확인</button>
        <button id="tab-keys" aria-selected="false">키 가이드</button>
        <button id="tab-board" aria-selected="false">리더보드</button>
      </div>

      <div id="pane-status" class="pane">
        <div id="installrow" hidden>
          <button id="install" type="button">홈 화면에 앱으로 설치</button>
        </div>
        <div id="settings">
          <div class="griprow">
            <span>grip</span>
            <div class="meter"><div id="gripfill"></div></div>
            <span id="gripval" class="v">0.00</span>
          </div>
          <div class="griprow" style="margin-top:7px">
            <span>fov</span>
            <input id="fov" type="range" min="20" max="120" step="1" value="51" />
            <span id="fovval" class="v">51°</span>
          </div>
          <!-- 30 deg is the requested camera tilt. On its own that frames floor:
               from an eye at 0.95 m the ray only reaches bench height at
               x ~ 1.5 m, past a bench spanning x 0.28-0.76. The robot's neck is
               pitched 30 deg to make up the difference; this slider is here for
               anyone who wants a different framing. -->
          <div class="griprow" style="margin-top:5px">
            <span>tilt</span>
            <input id="pitch" type="range" min="0" max="85" step="1" value="30" />
            <span id="pitchval" class="v">30°</span>
          </div>
        </div>
        <hr />
        <table id="stats"></table>
        <div id="log">booting…</div>
      </div>

      <div id="pane-keys" class="pane" hidden>
        <table id="keydetail"></table>
      </div>

      <div id="pane-board" class="pane" hidden>
        <div id="namerow">
          <input id="playerName" type="text" maxlength="8" placeholder="플레이어 이름" />
          <button id="saveName" type="button">이름 사용</button>
        </div>
        <div id="boardlevel"></div>
      <table id="lbtable"></table>
        <div id="lbnote"></div>
      </div>

      <div id="hint">Esc 를 다시 누르면 장면으로 돌아갑니다.</div>
    </div>
  </div>

</body>
</html>
