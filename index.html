<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ALLEX — MuJoCo WASM viability probe</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #14171c; color: #e6e8eb; overflow: hidden;
      font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    /* <canvas> is a replaced element: `inset: 0` alone will NOT stretch it, so
       width:auto resolves to the intrinsic 300x150 and the render collapses into
       a corner. The explicit 100% is required. */
    #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(12, 14, 18, .86); border: 1px solid #2b313a;
      border-radius: 8px; padding: 12px 14px; min-width: 330px;
      max-height: calc(100vh - 24px); overflow: auto;
      backdrop-filter: blur(6px);
    }
    #hud h1 { margin: 0 0 8px; font-size: 13px; letter-spacing: .04em; color: #9fb4d0; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 2px 0; vertical-align: top; }
    td.k { color: #8b95a3; padding-right: 12px; white-space: nowrap; }
    td.v { text-align: right; font-variant-numeric: tabular-nums; }
    .good { color: #6ddf8f; } .warn { color: #f0c268; } .bad { color: #ff7a6b; }
    hr { border: 0; border-top: 1px solid #2b313a; margin: 9px 0; }
    #log { margin-top: 8px; color: #7f8b99; white-space: pre-wrap; font-size: 12px; }
    #grip { margin-top: 10px; }
    .griprow { display: flex; align-items: center; gap: 8px; }
    .griprow > span:first-child { color: #8b95a3; }
    .meter {
      flex: 1; height: 7px; background: #232932;
      border-radius: 4px; overflow: hidden;
    }
    #gripfill { height: 100%; width: 0%; background: #6ddf8f; transition: width .05s linear; }
    #help td { color: #8b95a3; font-size: 12px; }
    #help td:first-child { white-space: nowrap; padding-right: 10px; }
    #help .key {
      display: inline-block; background: #232932; border: 1px solid #333c48;
      border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
      color: #c3ccd8; font-size: 11px;
    }
    kbd {
      background: #232932; border: 1px solid #333c48; border-bottom-width: 2px;
      border-radius: 4px; padding: 0 5px; font-size: 11px; color: #c3ccd8;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CNiiYF4h.js"></script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <h1>ALLEX · MuJoCo WASM probe</h1>
    <table id="stats"></table>
    <div id="grip">
      <div class="griprow">
        <span>grip</span>
        <div class="meter"><div id="gripfill"></div></div>
        <span id="gripval" class="v">0.00</span>
      </div>
    </div>
    <hr />
    <table id="help"></table>
    <hr />
    <div id="log">booting…</div>
  </div>
</body>
</html>
